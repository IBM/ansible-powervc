---
# Example 1: Enable pvcraid command
- name: "RAID Configuration - Enable pvcraid"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Enable pvcraid command via chpvc raid enable"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        action: enable
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 2: Disable pvcraid command
- name: "RAID Configuration - Disable pvcraid"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Disable pvcraid command via chpvc raid disable"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        action: disable
      register: result

    - name: "Show result"
      debug:
        var: result


