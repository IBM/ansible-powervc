# Example 17: Bind-mount a directory into a chroot
- name: "RAID Configuration - mount run (bind)"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Bind-mount /dev into chroot"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: mount
        operation: run
        source: /dev
        mountpoint: "{{ raid_mountpoint }}"
        bind: true
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 17a: Mount a filesystem by type (e.g. proc, sysfs) into a chroot
