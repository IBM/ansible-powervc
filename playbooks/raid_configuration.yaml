      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: mount
        operation: run
        source: "{{ raid_mount_source }}"
        fstype: "{{ raid_mount_fstype }}"
        mountpoint: "{{ raid_mountpoint }}"
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 18: Configure IBM 2145 Multipath
- name: "RAID Configuration - multipath configure"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Write /etc/multipath.conf and apply IBM 2145 multipath configuration"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: multipath
        operation: configure
        polling_interval: "{{ raid_polling_interval }}"
        path_grouping_policy: "{{ raid_path_grouping_policy }}"
        path_selector: "{{ raid_path_selector }}"
        prio: "{{ raid_prio }}"
        path_checker: "{{ raid_path_checker }}"
        failback: "{{ raid_failback }}"
        features: "{{ raid_features }}"
        no_path_retry: "{{ raid_no_path_retry }}"
        rr_weight: "{{ raid_rr_weight }}"
        rr_min_io_rq: "{{ raid_rr_min_io_rq }}"
        dev_loss_tmo: "{{ raid_dev_loss_tmo }}"
        alias_prefix: "{{ raid_alias_prefix }}"
      register: result

    - name: "Show result"
      debug:
        var: result


