  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Rewrite 39_powervc-fs-uuid script to hardcode DEVROOTFS=LABEL=rootfs"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: grub
