# Example 21: Remove empty directories
- name: "RAID Configuration - rmdir run"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Remove one or more empty directories"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: rmdir
        operation: run
        dirs: "{{ raid_dirs }}"
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 22: Rsync root filesystem to RAID destination
- name: "RAID Configuration - rsync run"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Rsync source directory to RAID destination"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: rsync
        operation: run
        rsync_source: "{{ raid_rsync_source }}"
        rsync_dest: "{{ raid_rsync_dest }}"
        excludes: "{{ raid_excludes }}"
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 23: Flush filesystem buffers to disk
- name: "RAID Configuration - sync run"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Flush all pending filesystem writes to disk"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: sync
        operation: run
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 24: Unmount a chroot stack (deepest first)
- name: "RAID Configuration - umount run"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Unmount chroot mountpoints in reverse-mount order"
      ibm.powervc.cli.raid_configuration:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        subcommand: umount
        operation: run
        mountpoints: "{{ raid_mountpoints }}"
      register: result

    - name: "Show result"
      debug:
        var: result
