---
# Example 1: List controller-node ifixes
- name: "PowerVC Update - List Controller Ifixes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Get list of applied ifixes on controller nodes"
      ibm.powervc.cli.update:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        list_ifixes: true
        state: present
      register: result

    - name: "Show ifixes"
      debug:
        var: result


# Example 2: List remote-node ifixes
- name: "PowerVC Update - List Remote-Node Ifixes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Get list of applied ifixes on remote nodes (novalinks / image nodes)"
      ibm.powervc.cli.update:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        list_ifixes: true
        state: present
      register: result

    - name: "Show remote-node ifixes"
      debug:
        var: result


# Example 3: Rolling upgrade on a specific controller node
- name: "PowerVC Update - Rolling Upgrade"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Perform rolling upgrade on specific controller node"
      ibm.powervc.cli.update:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        node: "{{ update_node }}"
        verbose: "{{ update_verbose }}"
        state: present
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 4: Apply ifix on a specific controller node
- name: "PowerVC Update - Apply Ifix on Controller Node"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Apply ifix ISO on specific controller node"
      ibm.powervc.cli.update:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        node: "{{ update_node }}"
        ifix_isopath: "{{ update_ifix_isopath }}"
        force: "{{ update_force }}"
        state: present
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 5: Apply ifix on all remote nodes (novalinks + image nodes)
- name: "PowerVC Update - Apply Ifix on All Remote Nodes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Apply ifix on all novalinks and image nodes"
      ibm.powervc.cli.update:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        all_remotenodes: true
        ifix_isopath: "{{ update_ifix_isopath }}"
        state: present
      register: result

    - name: "Show result"
      debug:
        var: result


