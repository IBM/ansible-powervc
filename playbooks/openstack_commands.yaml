---
- name: Map LDAP group to admin role in ibm-default project
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml
  tasks:
    - name: Assign pvcadmin group to admin role in ibm-default
      ibm.powervc.cli.openstack_commands:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        os_username: "{{ os_username }}"
        os_password: "{{ os_password }}"
        os_auth_url: "{{ os_auth_url | default(omit) }}"
        os_project: "{{ os_project }}"
        os_user_domain_name: "{{ os_user_domain_name }}"
        os_project_domain_name: "{{ os_project_domain_name }}"
        os_identity_api_version: "{{ os_identity_api_version }}"
        state: present
        role: "{{ role_mapping_role }}"
        project: ibm-default
        ldap_group: "{{ role_mapping_ldap_group }}"
      register: result
    - debug:
        var: result.stdout_lines


- name: Map LDAP group to admin role across all tenant projects
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml
  tasks:
    - name: Assign pvcadmin group to admin role in all projects
      ibm.powervc.cli.openstack_commands:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        os_username: "{{ os_username }}"
        os_password: "{{ os_password }}"
        os_auth_url: "{{ os_auth_url | default(omit) }}"
        os_project: "{{ os_project }}"
        os_user_domain_name: "{{ os_user_domain_name }}"
        os_project_domain_name: "{{ os_project_domain_name }}"
        os_identity_api_version: "{{ os_identity_api_version }}"
        state: present
        role: "{{ role_mapping_role }}"
        ldap_group: "{{ role_mapping_ldap_group }}"
        all_projects: true
      register: result
    - debug:
        var: result.stdout_lines
    - debug:
        var: result.projects_changed


