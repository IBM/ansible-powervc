# Example 9: Apply ifix on all remote nodes except specified ones
- name: "PowerVC iFix - Apply Ifix Skipping Specific Remote Nodes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Apply ifix on all remote nodes except the ones listed in skip_remotenodes_ifix"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        skip_remotenodes_ifix: "{{ ifix_skip_remotenodes_ifix }}"
        ifix_isopath: "{{ ifix_isopath }}"
        force: "{{ ifix_force }}"
        verbose: "{{ ifix_verbose }}"
      register: result

    - name: "Show result"
      debug:
        var: result
