# Example 8: Apply ifix on specific remote nodes
- name: "PowerVC iFix - Apply Ifix on Specific Remote Nodes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Apply ifix only on specified remote node IPs"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        apply_specificnodes: "{{ ifix_apply_specificnodes }}"
        ifix_isopath: "{{ ifix_isopath }}"
        force: "{{ ifix_force }}"
        verbose: "{{ ifix_verbose }}"
      register: result

    - name: "Show result"
      debug:
