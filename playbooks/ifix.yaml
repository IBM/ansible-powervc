---
# Example 1: List controller-node ifixes
- name: "PowerVC iFix - List Controller Ifixes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Get list of applied ifixes on controller nodes"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        list_ifixes: true
      register: result

    - name: "Show controller ifixes"
      debug:
        var: result


# Example 2: List remote-node ifixes
- name: "PowerVC iFix - List Remote-Node Ifixes"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Get list of applied ifixes on remote nodes (novalinks / image nodes)"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        list_ifixes: true
      register: result

    - name: "Show remote-node ifixes"
      debug:
        var: result


# Example 3: List ifixes on a specific controller node
- name: "PowerVC iFix - List Ifixes on Specific Node"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Get list of applied ifixes on a specific controller node"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        node: "{{ ifix_node }}"
        list_ifixes: true
      register: result

    - name: "Show specific node ifixes"
      debug:
        var: result


# Example 4: Apply ifix on a specific controller node
- name: "PowerVC iFix - Apply Ifix on Controller Node"
  hosts: localhost
  vars_files:
    - ../vars/powervc.yml
    - ../vars/secret.yml

  tasks:
    - name: "Apply ifix ISO on specific controller node"
      ibm.powervc.cli.ifix:
        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        node: "{{ ifix_node }}"
        ifix_isopath: "{{ ifix_isopath }}"
        force: "{{ ifix_force }}"
        verbose: "{{ ifix_verbose }}"
      register: result

    - name: "Show result"
      debug:
        var: result


# Example 5: Apply ifix on all remote nodes (novalinks + image nodes)
- name: "PowerVC iFix - Apply Ifix on All Remote Nodes"
