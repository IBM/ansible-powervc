        login_host: "{{ ipaddress }}"
        login_user: "{{ pvc_user }}"
        login_password: "{{ pvcroot_password }}"
        cluster: "{{ cluster_name }}"
        remote_node: true
        all_remotenodes: true
        ifix_isopath: "{{ ifix_isopath }}"
        force: "{{ ifix_force }}"
        verbose: "{{ ifix_verbose }}"
      register: result

    - name: "Show result"
      debug:
        var: result


